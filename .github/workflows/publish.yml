name: Publish verified stable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish after version-specific release review
        required: true
permissions:
  contents: read
concurrency:
  group: stable-release-publication
  cancel-in-progress: false
jobs:
  platforms:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: runtime/executor/go.sum
      - run: go test ./... -count=1
        working-directory: runtime/executor
      - run: go vet ./...
        working-directory: runtime/executor
      - name: Windows installation and stable-download fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./test/windows-installer.test.ps1
          ./test/windows-distribution.test.ps1
  publish:
    needs: platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: runtime/executor/go.sum
      - name: Require an existing matching stable version tag
        run: node -e 'const p=require("./package.json");if(!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)||process.env.RELEASE_TAG!=="v"+p.version)throw new Error("Tag must match the stable package version.")'
      - run: npm run check
      - run: npm run release:validate
      - name: Validate version-specific acceptance decision
        run: node scripts/validate-host-acceptance.mjs --stable
      - run: GITHUB_SHA="$(git rev-parse HEAD)" npm run release:package
      - run: npm run release:verify -- --publishable
      - name: Create a draft without changing the public stable release
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const version = process.env.RELEASE_TAG.slice(1);
          const sections = ["CHANGELOG.md", "CHANGELOG.zh-CN.md"].map(file => {
            const source = readFileSync(file, "utf8");
            const heading = `## ${version} - `;
            const start = source.indexOf(heading);
            if (start < 0) throw new Error(`Missing ${version} release notes in ${file}`);
            const end = source.indexOf("\n## ", start + heading.length);
            return source.slice(start, end < 0 ? undefined : end).trim();
          });
          writeFileSync(process.env.RUNNER_TEMP + "/release-notes.md", sections.join("\n\n") + "\n");
          JS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Upload only the verified release set
        run: |
          gh release upload "$RELEASE_TAG" dist/releases/release-manifest.json dist/releases/puretokens-skill-install.sh dist/releases/puretokens-skill-install.ps1 dist/releases/puretokens-skill-fetch.sh dist/releases/puretokens-skill-fetch.ps1 "dist/releases/puretokens-skill-${RELEASE_TAG#v}-darwin-amd64.zip" "dist/releases/puretokens-skill-${RELEASE_TAG#v}-darwin-arm64.zip" "dist/releases/puretokens-skill-${RELEASE_TAG#v}-linux-amd64.zip" "dist/releases/puretokens-skill-${RELEASE_TAG#v}-linux-arm64.zip" "dist/releases/puretokens-skill-${RELEASE_TAG#v}-windows-amd64.zip" "dist/releases/puretokens-skill-${RELEASE_TAG#v}-windows-arm64.zip"
      - name: Verify the actual uploaded bytes before publication
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/stable-release-assets"
          npm run release:verify -- --publishable --directory "$RUNNER_TEMP/stable-release-assets"
      - name: Promote the complete verified draft
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify anonymous stable installation downloads
        timeout-minutes: 10
        run: |
          mkdir "$RUNNER_TEMP/public-stable-assets"
          for asset in dist/releases/*; do
            filename="$(basename "$asset")"
            curl -q --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 60 \
              "https://github.com/${{ github.repository }}/releases/latest/download/$filename" \
              --output "$RUNNER_TEMP/public-stable-assets/$filename"
          done
          npm run release:verify -- --publishable --directory "$RUNNER_TEMP/public-stable-assets"
